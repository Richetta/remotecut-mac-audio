# Builds rc-audio (Apple Silicon + Intel in one file) on GitHub's free Mac machines and publishes it as a
# release of this repository. Runs on every push of a tag like "v1.0.0", or by hand from the Actions tab.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile (arm64 + x86_64)
        run: |
          swiftc -O -target arm64-apple-macos13 rc-audio.swift -o rc-audio-arm64
          swiftc -O -target x86_64-apple-macos13 rc-audio.swift -o rc-audio-x64
          lipo -create rc-audio-arm64 rc-audio-x64 -output rc-audio
          codesign --force -s - rc-audio
          lipo -info rc-audio
          ./rc-audio --version
          shasum -a 256 rc-audio | tee rc-audio.sha256
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rc-audio rc-audio.sha256 --title "rc-audio $GITHUB_REF_NAME" --notes "Audio del sistema para Remote Cut en Mac (ScreenCaptureKit)."
      - uses: actions/upload-artifact@v4
        with:
          name: rc-audio
          path: rc-audio
